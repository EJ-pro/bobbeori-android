<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1920" viewBox="0 0 1440 1920">
  <rect width="1440" height="1920" fill="#FFFFFF"/>
  <text x="96" y="150" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="54" font-weight="800" fill="#171A21" text-anchor="start"><tspan x="96" dy="0">누구의 어떤 문제를 해결하는가</tspan></text>
  <text x="96" y="218" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="25" font-weight="450" fill="#5F6875" text-anchor="start"><tspan x="96" dy="0">더 많은 레시피보다 실제 조리 중의 불편에 집중한다</tspan></text>
  <text x="1344" y="1828" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="20" font-weight="600" fill="#5F6875" text-anchor="end"><tspan x="1344" dy="0">02</tspan></text>
  <g transform="translate(96 310)">
<rect x="0" y="0" width="206" height="54" rx="27" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/><text x="103" y="36" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#2457A6" text-anchor="middle"><tspan x="103" dy="0">핵심 고객</tspan></text><text x="0" y="98" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="29" font-weight="500" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">유튜브에서 요리 영상을 찾고 실제로 따라 만들지만</tspan><tspan x="0" dy="43.5">조리 경험이 부족해 중간에 자주 멈추는 20~30대 1~2인 가구</tspan></text>
<rect x="0" y="310" width="266" height="54" rx="27" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/><text x="133" y="346" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#2457A6" text-anchor="middle"><tspan x="133" dy="0">반복되는 문제</tspan></text><text x="0" y="408" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="29" font-weight="500" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">재료와 분량을 다시 찾기 위해 영상을 되돌리고</tspan><tspan x="0" dy="43.5">젖은 손으로 화면을 조작하거나 별도 검색을 반복한다</tspan></text>
<rect x="0" y="620" width="236" height="54" rx="27" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/><text x="118" y="656" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#2457A6" text-anchor="middle"><tspan x="118" dy="0">결정적 순간</tspan></text><text x="0" y="718" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="29" font-weight="500" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">불 세기, 익힘 상태, 재료 대체처럼 영상에 없는 판단이 필요할 때</tspan><tspan x="0" dy="43.5">사용자는 요리를 멈추거나 결과를 망친다</tspan></text>
<rect x="0" y="930" width="326" height="54" rx="27" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/><text x="163" y="966" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#2457A6" text-anchor="middle"><tspan x="163" dy="0">고객이 원하는 것</tspan></text><text x="0" y="1028" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="29" font-weight="500" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">새로운 레시피 목록이 아니라 자신이 고른 영상을 이해하고</tspan><tspan x="0" dy="43.5">지금 해야 할 행동을 바로 알려주는 조리 파트너</tspan></text>
</g></svg>