<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1920" viewBox="0 0 1440 1920">
  <rect width="1440" height="1920" fill="#FFFFFF"/>
  <text x="96" y="150" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="54" font-weight="800" fill="#171A21" text-anchor="start"><tspan x="96" dy="0">핵심 사용자 흐름</tspan></text>
  <text x="96" y="218" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="25" font-weight="450" fill="#5F6875" text-anchor="start"><tspan x="96" dy="0">영상 발견 이후부터 요리 완료까지 연결한다</tspan></text>
  <text x="1344" y="1828" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="20" font-weight="600" fill="#5F6875" text-anchor="end"><tspan x="1344" dy="0">03</tspan></text>
  <g transform="translate(96 310)">
<rect x="0" y="250" width="224" height="350" rx="22" fill="#F7F8FA" stroke="#DCE2EA" stroke-width="2"/><text x="28" y="310" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="800" fill="#2457A6" text-anchor="start"><tspan x="28" dy="0">1</tspan></text><text x="28" y="380" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="30" font-weight="750" fill="#171A21" text-anchor="start"><tspan x="28" dy="0">링크 입력</tspan></text><text x="28" y="470" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="450" fill="#5F6875" text-anchor="start"><tspan x="28" dy="0">사용자가 고른</tspan><tspan x="28" dy="31.9">유튜브 영상</tspan></text>
<rect x="256" y="250" width="224" height="350" rx="22" fill="#F7F8FA" stroke="#DCE2EA" stroke-width="2"/><text x="284" y="310" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="800" fill="#2457A6" text-anchor="start"><tspan x="284" dy="0">2</tspan></text><text x="284" y="380" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="30" font-weight="750" fill="#171A21" text-anchor="start"><tspan x="284" dy="0">레시피 추출</tspan></text><text x="284" y="470" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="450" fill="#5F6875" text-anchor="start"><tspan x="284" dy="0">재료와 분량</tspan><tspan x="284" dy="31.9">조리 단계</tspan></text>
<rect x="512" y="250" width="224" height="350" rx="22" fill="#F7F8FA" stroke="#DCE2EA" stroke-width="2"/><text x="540" y="310" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="800" fill="#2457A6" text-anchor="start"><tspan x="540" dy="0">3</tspan></text><text x="540" y="380" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="30" font-weight="750" fill="#171A21" text-anchor="start"><tspan x="540" dy="0">내용 확인</tspan></text><text x="540" y="470" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="450" fill="#5F6875" text-anchor="start"><tspan x="540" dy="0">오류와 불확실성</tspan><tspan x="540" dy="31.9">직접 수정</tspan></text>
<rect x="768" y="250" width="224" height="350" rx="22" fill="#F7F8FA" stroke="#DCE2EA" stroke-width="2"/><text x="796" y="310" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="800" fill="#2457A6" text-anchor="start"><tspan x="796" dy="0">4</tspan></text><text x="796" y="380" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="30" font-weight="750" fill="#171A21" text-anchor="start"><tspan x="796" dy="0">요리 대화</tspan></text><text x="796" y="470" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="450" fill="#5F6875" text-anchor="start"><tspan x="796" dy="0">현재 단계를</tspan><tspan x="796" dy="31.9">기억하며 안내</tspan></text>
<rect x="1024" y="250" width="224" height="350" rx="22" fill="#F7F8FA" stroke="#DCE2EA" stroke-width="2"/><text x="1052" y="310" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="800" fill="#2457A6" text-anchor="start"><tspan x="1052" dy="0">5</tspan></text><text x="1052" y="380" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="30" font-weight="750" fill="#171A21" text-anchor="start"><tspan x="1052" dy="0">요리 완료</tspan></text><text x="1052" y="470" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="450" fill="#5F6875" text-anchor="start"><tspan x="1052" dy="0">변경사항과</tspan><tspan x="1052" dy="31.9">진행 기록</tspan></text>
<rect x="0" y="760" width="1248" height="460" rx="28" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/>
<text x="48" y="830" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="24" font-weight="750" fill="#2457A6" text-anchor="start"><tspan x="48" dy="0">사용자가 실제로 하는 말</tspan></text>
<text x="48" y="930" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="40" font-weight="750" fill="#171A21" text-anchor="start"><tspan x="48" dy="0">“다음은 뭐야?”</tspan><tspan x="48" dy="62">“여기까지 했어.”</tspan><tspan x="48" dy="62">“양파가 없는데 뭘로 대체해?”</tspan><tspan x="48" dy="62">“지금 너무 묽은데 어떻게 해야 해?”</tspan></text>
<text x="0" y="1380" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="30" font-weight="650" fill="#5F6875" text-anchor="start"><tspan x="0" dy="0">스몰토크를 하더라도 조리 단계와 변경사항은 유지한다.</tspan></text>
</g></svg>