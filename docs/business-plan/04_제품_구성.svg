<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1920" viewBox="0 0 1440 1920">
  <rect width="1440" height="1920" fill="#FFFFFF"/>
  <text x="96" y="150" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="54" font-weight="800" fill="#171A21" text-anchor="start"><tspan x="96" dy="0">제품은 두 가지 AI 역할로 구성한다</tspan></text>
  <text x="96" y="218" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="25" font-weight="450" fill="#5F6875" text-anchor="start"><tspan x="96" dy="0">추출과 조리 대화를 분리해 정확성과 맥락 유지에 집중한다</tspan></text>
  <text x="1344" y="1828" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="20" font-weight="600" fill="#5F6875" text-anchor="end"><tspan x="1344" dy="0">04</tspan></text>
  <g transform="translate(96 310)">
<rect x="0" y="50" width="596" height="560" rx="28" fill="#F7F8FA" stroke="#DCE2EA" stroke-width="2"/>
<text x="44" y="130" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="35" font-weight="800" fill="#171A21" text-anchor="start"><tspan x="44" dy="0">레시피 추출 AI</tspan></text>
<text x="44" y="205" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="25" font-weight="500" fill="#5F6875" text-anchor="start"><tspan x="44" dy="0">영상 자막과 설명을 바탕으로</tspan></text>
<text x="44" y="300" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="34" font-weight="700" fill="#171A21" text-anchor="start"><tspan x="44" dy="0">요리명</tspan><tspan x="44" dy="52.7">재료와 분량</tspan><tspan x="44" dy="52.7">조리 도구</tspan><tspan x="44" dy="52.7">조리 순서</tspan><tspan x="44" dy="52.7">예상 시간과 주의사항</tspan></text>
<rect x="652" y="50" width="596" height="560" rx="28" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/>
<text x="696" y="130" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="35" font-weight="800" fill="#171A21" text-anchor="start"><tspan x="696" dy="0">요리 동행 AI</tspan></text>
<text x="696" y="205" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="25" font-weight="500" fill="#5F6875" text-anchor="start"><tspan x="696" dy="0">레시피와 현재 진행 상태를 바탕으로</tspan></text>
<text x="696" y="300" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="34" font-weight="700" fill="#171A21" text-anchor="start"><tspan x="696" dy="0">다음 단계 안내</tspan><tspan x="696" dy="52.7">재료 대체</tspan><tspan x="696" dy="52.7">인분과 분량 조정</tspan><tspan x="696" dy="52.7">실패 복구</tspan><tspan x="696" dy="52.7">질문과 스몰토크</tspan></text>
<text x="0" y="800" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="35" font-weight="800" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">핵심 제품 원칙</tspan></text>
<rect x="0" y="870" width="130" height="54" rx="27" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/><text x="65" y="906" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#2457A6" text-anchor="middle"><tspan x="65" dy="0">근거</tspan></text><text x="0" y="968" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="29" font-weight="500" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">영상에서 확인되지 않은 내용은 확정하지 않고 불확실성을 표시한다</tspan></text>
<rect x="0" y="1080" width="130" height="54" rx="27" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/><text x="65" y="1116" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#2457A6" text-anchor="middle"><tspan x="65" dy="0">상태</tspan></text><text x="0" y="1178" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="29" font-weight="500" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">현재 단계, 완료 단계, 대체 재료와 사용자 수정을 기억한다</tspan></text>
<rect x="0" y="1290" width="130" height="54" rx="27" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/><text x="65" y="1326" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#2457A6" text-anchor="middle"><tspan x="65" dy="0">안전</tspan></text><text x="0" y="1388" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="29" font-weight="500" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">익힘, 화상, 알레르기 질문은 보수적으로 안내한다</tspan></text>
</g></svg>