<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1920" viewBox="0 0 1440 1920">
  <rect width="1440" height="1920" fill="#FFFFFF"/>
  <text x="96" y="150" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="54" font-weight="800" fill="#171A21" text-anchor="start"><tspan x="96" dy="0">시장보다 먼저 사용 행동을 검증한다</tspan></text>
  <text x="96" y="218" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="25" font-weight="450" fill="#5F6875" text-anchor="start"><tspan x="96" dy="0">첫 목표는 다운로드가 아니라 조리 완료와 반복 사용이다</tspan></text>
  <text x="1344" y="1828" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="20" font-weight="600" fill="#5F6875" text-anchor="end"><tspan x="1344" dy="0">07</tspan></text>
  <g transform="translate(96 310)">
<rect x="0" y="50" width="1248" height="260" rx="28" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/>
<text x="48" y="125" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="24" font-weight="750" fill="#2457A6" text-anchor="start"><tspan x="48" dy="0">가장 중요한 질문</tspan></text>
<text x="48" y="205" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="40" font-weight="800" fill="#171A21" text-anchor="start"><tspan x="48" dy="0">영상 분석과 상태형 대화가 실제로</tspan><tspan x="48" dy="56">사용자의 되감기와 별도 검색을 줄이는가</tspan></text>
<text x="0" y="470" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="35" font-weight="800" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">측정할 지표</tspan></text>
<rect x="0" y="540" width="146" height="54" rx="27" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/><text x="73" y="576" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#2457A6" text-anchor="middle"><tspan x="73" dy="0">시작률</tspan></text><text x="0" y="638" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="29" font-weight="500" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">링크 분석 후 실제 조리 세션을 시작한 비율</tspan></text>
<rect x="0" y="740" width="146" height="54" rx="27" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/><text x="73" y="776" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#2457A6" text-anchor="middle"><tspan x="73" dy="0">완료율</tspan></text><text x="0" y="838" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="29" font-weight="500" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">시작한 조리 세션을 완료한 비율</tspan></text>
<rect x="0" y="940" width="146" height="54" rx="27" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/><text x="73" y="976" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#2457A6" text-anchor="middle"><tspan x="73" dy="0">수정률</tspan></text><text x="0" y="1038" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="29" font-weight="500" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">추출된 재료와 단계 중 사용자가 수정한 비율</tspan></text>
<rect x="0" y="1140" width="206" height="54" rx="27" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/><text x="103" y="1176" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#2457A6" text-anchor="middle"><tspan x="103" dy="0">맥락 성공</tspan></text><text x="0" y="1238" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="29" font-weight="500" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">현재 단계를 다시 설명하지 않고 답을 얻은 비율</tspan></text>
<rect x="0" y="1340" width="206" height="54" rx="27" fill="#EEF4FC" stroke="#EEF4FC" stroke-width="2"/><text x="103" y="1376" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="22" font-weight="700" fill="#2457A6" text-anchor="middle"><tspan x="103" dy="0">반복 사용</tspan></text><text x="0" y="1438" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="29" font-weight="500" fill="#171A21" text-anchor="start"><tspan x="0" dy="0">7일 또는 30일 안에 다른 영상으로 다시 요리한 비율</tspan></text>
</g></svg>